<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gov Signals - LATAM Government Relations Radar</title>
<style>
:root {
  --agco-red: #cc0000; --agco-black: #111111; --agco-dark-gray: #333333;
  --agco-light-gray: #f4f4f4; --text-main: #222222; --white: #ffffff;
  --farol-positive-bg: #e2f0d9; --farol-positive-text: #385723; --farol-positive-dot: #70ad47;
  --farol-warning-bg: #fff2cc;  --farol-warning-text: #7f6000;  --farol-warning-dot: #ffc000;
  --farol-critical-bg: #fce4d6; --farol-critical-text: #c65911; --farol-critical-dot: #c00000;
  --farol-neutral-bg: #eeeeee;  --farol-neutral-text: #777777;  --farol-neutral-dot: #bbbbbb;
}
@keyframes blink-critical { 50% { border-color: #ff6b6b; } }
*, *::before, *::after { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #e9ecef; color: var(--text-main); margin: 0; padding: 20px; }
.container { max-width: 1350px; margin: 0 auto; background: var(--white); box-shadow: 0 10px 25px rgba(0,0,0,.15); border-radius: 4px; overflow: hidden; }
.header { background: var(--agco-black); color: var(--white); padding: 30px 40px; border-bottom: 6px solid var(--agco-red);
  display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.header-text h1 { margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 900; }
.header-text p { margin: 5px 0 0; font-size: 12px; color: #b0b0b0; text-transform: uppercase; letter-spacing: .5px; }
.header-controls { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.lang-selector { display: flex; gap: 5px; background: #2a2a2a; padding: 4px; border-radius: 4px; }
.lang-btn { background: transparent; border: none; color: #a0a0a0; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 2px; }
.lang-btn:hover { background: #444; color: var(--white); }
.lang-btn.active { background: var(--agco-red); color: var(--white); }
.date-badge { background: var(--agco-red); padding: 8px 16px; font-weight: bold; font-size: 13px; border-radius: 2px; text-transform: uppercase; letter-spacing: 1px; }
.content-wrapper { padding: 25px 35px; }
.alert-banner { background: var(--agco-light-gray); border-left: 5px solid var(--agco-red); padding: 12px 20px; margin-bottom: 25px;
  font-size: 11px; font-weight: bold; color: var(--agco-dark-gray); text-transform: uppercase; letter-spacing: .5px; line-height: 1.6; }
.toolbar { display: flex; justify-content: flex-end; margin: -10px 0 15px; }
.toolbar label { font-size: 12px; font-weight: bold; color: var(--agco-dark-gray); cursor: pointer; text-transform: uppercase; }
.tabs-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 25px; border-bottom: 3px solid var(--agco-black); padding-bottom: 5px; }
.tab-btn { background: var(--agco-light-gray); color: var(--agco-dark-gray); border: none; padding: 11px 16px; font-size: 12px; font-weight: bold;
  cursor: pointer; text-transform: uppercase; border-radius: 4px 4px 0 0; transition: all .2s; }
.tab-btn:hover { background: #e0e0e0; color: var(--agco-black); }
.tab-btn.active { background: var(--agco-black); color: var(--white); border-bottom: 3px solid var(--agco-red); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.country-title { font-size: 24px; color: var(--agco-black); margin: 0 0 25px; padding-bottom: 10px; border-bottom: 2px solid #ddd; font-weight: 800; text-transform: uppercase; }
.section-title { font-size: 18px; color: var(--agco-dark-gray); margin: 10px 0 20px; padding-bottom: 10px; border-bottom: 1px solid #e9ecef; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.sub-title { font-size: 14px; text-transform: uppercase; color: var(--agco-black); margin: 28px 0 14px; padding-left: 10px; border-left: 4px solid var(--agco-red); }
.sub-count { background: var(--agco-black); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
.hint { font-size: 12px; color: #777; margin: -10px 0 12px; }
.empty { color: #777; font-style: italic; }
/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
.kpi { border: 2px solid var(--agco-black); border-radius: 6px; padding: 16px; text-align: center; }
.kpi-val { font-size: 30px; font-weight: 900; color: var(--agco-red); }
.kpi-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #555; font-weight: bold; margin-top: 4px; }
/* Mapa de calor */
.table-wrap { overflow-x: auto; margin-bottom: 30px; }
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 12px; }
table.heat th { background: var(--agco-black); color: #fff; padding: 8px 6px; font-size: 10.5px; text-transform: uppercase; font-weight: bold; }
table.heat td { padding: 10px 6px; text-align: center; font-weight: bold; border-radius: 3px; }
table.heat tbody tr { cursor: pointer; }
table.heat tbody tr:hover td { filter: brightness(.94); }
td.pais-cell { text-align: left !important; background: var(--agco-light-gray); white-space: nowrap; }
.cell.farol-critical { background: var(--farol-critical-bg); color: var(--farol-critical-text); }
.cell.farol-warning  { background: var(--farol-warning-bg);  color: var(--farol-warning-text); }
.cell.farol-positive { background: var(--farol-positive-bg); color: var(--farol-positive-text); }
.cell.farol-neutral  { background: var(--farol-neutral-bg);  color: var(--farol-neutral-text); }
/* Radar (cards) */
.analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 35px; }
.analysis-card { background: var(--white); border: 2px solid var(--agco-red); border-radius: 6px; padding: 15px; box-shadow: 0 2px 4px rgba(0,0,0,.04); transition: transform .25s, box-shadow .25s; }
.analysis-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,.07); }
.analysis-card.tendencia-negativa { animation: blink-critical 1.3s ease-in-out infinite; }
.analysis-card.tendencia-vazia { border-color: #ccc; }
.analysis-header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-bottom: 12px; border-bottom: 1px solid #f1f3f5; margin-bottom: 12px; }
.analysis-icon { font-size: 22px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }
.tendencia-positiva .analysis-icon { background: var(--farol-positive-bg); }
.tendencia-negativa .analysis-icon { background: var(--farol-critical-bg); }
.tendencia-neutra   .analysis-icon { background: var(--farol-warning-bg); }
.tendencia-vazia    .analysis-icon { background: var(--farol-neutral-bg); }
h3.analysis-card-title { font-size: 14px; font-weight: 700; color: #212529; margin: 0; flex: 1 1 130px; min-width: 0; overflow-wrap: break-word; }
.analysis-text { font-size: 13px; color: #495057; line-height: 1.55; margin: 0; }
/* Noticias */
.news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1024px) { .news-grid { grid-template-columns: 1fr; } }
.news-block { background: var(--white); border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,.02); }
.news-header { background: var(--agco-light-gray); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--agco-black); gap: 15px; }
.farol-border-critico { border-left-color: var(--farol-critical-dot); }
.farol-border-atencao { border-left-color: var(--farol-warning-dot); }
.farol-border-positivo { border-left-color: var(--farol-positive-dot); }
.news-title { font-size: 13.5px; font-weight: bold; color: var(--agco-black); margin: 0; line-height: 1.4; display: flex; align-items: center; gap: 10px; }
.news-topic-icon { font-size: 1.3em; line-height: 1; }
.news-body { padding: 14px 18px; font-size: 13px; color: var(--agco-dark-gray); line-height: 1.5; flex-grow: 1; }
.news-body p { margin: 8px 0; }
.news-original { font-size: 11.5px; color: #888; font-style: italic; }
.news-source { font-size: 11px; color: #888; text-align: right; font-style: italic; border-top: 1px solid #f0f0f0; padding-top: 8px; margin-bottom: 0 !important; }
.news-source a { color: var(--agco-red); font-weight: bold; text-decoration: none; }
.news-source a:hover { text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 10px; font-weight: bold; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; letter-spacing: .4px; }
.tag-new { background: var(--agco-red); color: #fff; }
.tag-status { background: var(--agco-black); color: #fff; }
.tag-conf-A { background: #dbeafe; color: #1e40af; }
.tag-conf-B { background: #e5e7eb; color: #374151; }
.tag-conf-C { background: #fff7ed; color: #9a3412; }
.farol { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 10.5px; font-weight: bold; border-radius: 4px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
.farol-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.farol-positive { background: var(--farol-positive-bg); color: var(--farol-positive-text); } .farol-positive .farol-dot { background: var(--farol-positive-dot); }
.farol-warning  { background: var(--farol-warning-bg);  color: var(--farol-warning-text); }  .farol-warning  .farol-dot { background: var(--farol-warning-dot); }
.farol-critical { background: var(--farol-critical-bg); color: var(--farol-critical-text); } .farol-critical .farol-dot { background: var(--farol-critical-dot); }
.farol-neutral  { background: var(--farol-neutral-bg);  color: var(--farol-neutral-text); }  .farol-neutral  .farol-dot { background: var(--farol-neutral-dot); }
.machinery-analysis { background: #fafafa; border-top: 1px solid #e0e0e0; padding: 12px 18px; }
.analysis-title { font-weight: bold; color: var(--agco-black); margin-bottom: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
.m-desc { color: #555; line-height: 1.45; font-size: 12.5px; }
body.only-new .news-block[data-novo="0"] { display: none; }
.footer { background: var(--agco-black); color: #777; text-align: center; padding: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-top: 4px solid var(--agco-red); line-height: 1.8; }
</style>
</head>
<body>
<div id="google_translate_element" style="display:none;"></div>
<div class="container">
  <div class="header">
    <div class="header-text">
      <h1 class="notranslate">Gov Signals</h1>
      <p><span class="i18n notranslate" data-pt="Radar de Relações Governamentais e Institucionais LATAM" data-en="LATAM Government &amp; Institutional Relations Radar" data-es="Radar de Relaciones Gubernamentales e Institucionales LATAM">Radar de Relações Governamentais e Institucionais LATAM</span></p>
    </div>
    <div class="header-controls">
      <div class="lang-selector notranslate">
        <button class="lang-btn active" data-lang="pt" onclick="switchLanguage(event, 'pt')" title="Português">🇧🇷 PT</button>
        <button class="lang-btn" data-lang="en" onclick="switchLanguage(event, 'en')" title="English">🇺🇸 EN</button>
        <button class="lang-btn" data-lang="es" onclick="switchLanguage(event, 'es')" title="Español">🇪🇸 ES</button>
      </div>
      <div class="date-badge">{{DATA_RELATORIO}}</div>
    </div>
  </div>
  <div class="content-wrapper">
    <div class="alert-banner">{{BANNER}}</div>
    <div class="toolbar"><label><input type="checkbox" id="onlyNew" onchange="toggleNew(this)"> <span class="i18n notranslate" data-pt="Mostrar somente notícias novas" data-en="Show only new items" data-es="Mostrar solo noticias nuevas">Mostrar somente notícias novas</span></label></div>
    <div class="tabs-nav">{{ABAS}}</div>
    {{CONTEUDO}}
  </div>
  <div class="footer">
    <span class="i18n notranslate" data-pt="Relações Governamentais LATAM" data-en="LATAM Government Relations" data-es="Relaciones Gubernamentales LATAM">Relações Governamentais LATAM</span><br>
    {{ATUALIZADO}}
  </div>
</div>
<script>
/* ===== Idiomas =====
   1) Interface, nomes, faróis e textos da IA: trocados na hora (data-pt / data-en / data-es).
   2) Manchetes sem tradução da IA (modo regras): traduzidas pelo Google Tradutor
      a partir de qualquer idioma de origem (auto -> idioma escolhido). */
var IDIOMAS = ['pt', 'en', 'es'];
function lerIdioma() {
  var m = document.cookie.match(/googtrans=\/[^\/]*\/(pt|en|es)/);
  if (m) return m[1];
  try { var salvo = localStorage.getItem('govsignals_lang'); if (IDIOMAS.indexOf(salvo) > -1) return salvo; } catch (e) {}
  return 'pt';
}
var IDIOMA = lerIdioma();
function aplicarIdioma(lang) {
  document.querySelectorAll('.i18n').forEach(function (el) {
    var txt = el.getAttribute('data-' + lang);
    if (txt !== null) el.textContent = txt;
  });
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
  document.documentElement.setAttribute('data-ui-lang', lang);
}
function definirCookie(valor) {
  var host = location.hostname;
  document.cookie = 'googtrans=' + valor + '; path=/';
  if (host && host.indexOf('.') > -1) document.cookie = 'googtrans=' + valor + '; path=/; domain=.' + host;
}
function switchLanguage(event, lang) {
  event.preventDefault();
  if (lang === IDIOMA) return;
  try { localStorage.setItem('govsignals_lang', lang); } catch (e) {}
  definirCookie('/auto/' + lang);   // inclusive PT: traduz manchetes em espanhol para português
  window.location.reload();
}
function openTab(id) {
  document.querySelectorAll('.tab-content').forEach(function (t) { t.classList.toggle('active', t.id === id); });
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === id); });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toggleNew(cb) { document.body.classList.toggle('only-new', cb.checked); }
function googleTranslateElementInit() {
  new google.translate.TranslateElement({ autoDisplay: false, includedLanguages: 'pt,en,es',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
}
// garante o cookie mesmo no primeiro acesso (padrão: português)
if (!/googtrans=/.test(document.cookie)) definirCookie('/auto/' + IDIOMA);
aplicarIdioma(IDIOMA);
</script>
<style>
/* esconde a barra do Google Tradutor */
.goog-te-banner-frame, .skiptranslate iframe, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
body { top: 0 !important; }
font[style] { background: none !important; box-shadow: none !important; }
</style>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
